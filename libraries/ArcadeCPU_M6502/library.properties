name=ArcadeCPU_M6502
version=0.1.0
author=Nicolas Allemand (superzazu/6502)
maintainer=arcade_arduino project
sentence=Portable MOS 6502 / 65C02 CPU interpreter (MIT), vendored from superzazu/6502 -- passes Klaus Dormann's 6502_functional_test and 6502_decimal_test.
paragraph=No hardware dependencies -- registers, flags, and per-instance read_byte/write_byte function pointers on the m6502 struct, driven by m6502_step()/m6502_gen_irq()/m6502_gen_nmi(). Defaults to NMOS 6502 behaviour (m65c02_mode = 0). Adds an optional read_opcode callback so a machine with encrypted opcodes (Burger Time's DECO CPU-7) can descramble instruction fetches without the CPU library knowing anything about that machine. Fourth CPU family in this project, after ArcadeCPU_i8080, ArcadeCPU_Z80 and ArcadeCPU_MCS48.
category=Other
url=https://github.com/superzazu/6502
architectures=*
