name=ArcadeCPU_MCS48
version=0.1.0
author=arcade_arduino project
maintainer=arcade_arduino project
sentence=Intel MCS-48 (8035/8039/8048, and the Fujitsu MB8884 clone) interpreter. No hardware or game knowledge.
paragraph=The project's third CPU axis, alongside ArcadeCPU_i8080 and ArcadeCPU_Z80, added for Donkey Kong's sound board. Transcribed from MAME's own mcs48 device (src/devices/cpu/mcs48/mcs48.cpp, upstream mamedev/mame) for opcode semantics, cycle counts, the timer/counter prescaler and the interrupt model. Hardware access is wired through per-instance function pointers on the mcs48 struct, the same shape ArcadeCPU_Z80 uses, so one core can serve several machines in one build.
