name=ArcadeCPU_Z80
version=0.1.0
author=Nicolas Allemand (superzazu/z80)
maintainer=arcade_arduino project
sentence=Portable Z80 CPU interpreter (MIT), vendored verbatim from superzazu/z80 -- passes zexdoc/zexall.
paragraph=No hardware dependencies -- registers, and per-instance read_byte/write_byte/port_in/port_out function pointers on the z80 struct, driven by z80_step()/z80_gen_int()/z80_gen_nmi(). A Machine library provides the callbacks and drives the CPU each frame. This is the project's first Z80-family CPU core, sibling to ArcadeCPU_i8080.
