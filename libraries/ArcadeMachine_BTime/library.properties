sentence=Burger Time (Data East, 1982) machine layer -- memory map, DECO CPU-7 opcode descrambler, char/sprite/background video, input and sound wiring.
paragraph=Board-agnostic: talks only to ArcadeHAL and ArcadeCPU_M6502. The project's first 6502 machine, first encrypted-opcode CPU, first game with no vblank interrupt at all (it polls a vblank bit wired into a DIP-switch port) and first palette held in RAM rather than a PROM. Built against the real btime ROM set and verified against MAME's src/mame/dataeast/btime.cpp; see each source file's header for citations and BTIME_PORT_PLAN.md for the full research.
category=Other
