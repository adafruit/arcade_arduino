sentence=Donkey Kong "machine": Z80 memory map, i8257 sprite DMA, tilemap+sprite renderer with resistor-network palette decode, ROM/PROM asset manifest -- board-agnostic. Sound not yet implemented.
paragraph=Built from scratch against the real arcade ROM/PROM dump and verified against MAME's own dkong driver source (dkong.cpp, dkong_v.cpp, i8257.cpp, resnet.cpp) -- see each .cpp file's header comment for citations. Two things make this machine unlike the project's other Z80 games: sprites reach the video hardware only via an i8257 DMA controller the Z80 pulses once a frame, and its inputs are ACTIVE HIGH rather than active low. Its sound hardware (an 8035-class MCU plus a discrete analog network) is not emulated yet; dkong_audio.cpp is a silent stub that keeps the ArcadeHAL audio contract satisfied. Pair with any ArcadeBoard_* library that implements ArcadeHAL to build a flashable sketch.
