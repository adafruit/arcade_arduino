sentence=Galaga "machine": 3x Z80 shared-memory map, tile+sprite+05XX-starfield VRAM renderer, Namco WSG and 54XX explosion sound, HLE 06XX/51XX/54XX custom I/O, ROM/PROM asset manifest -- board-agnostic.
paragraph=The project's first multi-CPU port. Every hardware fact (memory map, I/O map, interrupt/NMI scheme, CPU interleave quantum, tile/sprite decode, palette decode, WSG registers, 06XX/51XX/54XX protocol, discrete audio filter values) was verified against MAME's own galaga driver, device, and audio-netlist source -- see each .cpp file's header comment for citations. 51XX/54XX are hand-coded high-level emulation of their documented command protocol, not ports of the real Fujitsu MB8843/MB8844 firmware (which this project does not have dumps for) -- see galaga_51xx.cpp/galaga_54xx.cpp for the honesty note this implies. Pair with any ArcadeBoard_* library that implements ArcadeHAL to build a flashable sketch.
