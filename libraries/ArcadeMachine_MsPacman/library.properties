sentence=Ms. Pac-Man "machine": Pac-Man's Z80 board plus the aux daughterboard's banked/encrypted ROM, tile+sprite VRAM renderer, Namco WSG sound, ROM/PROM asset manifest -- board-agnostic.
paragraph=A sibling of ArcadeMachine_Pacman, not a variant of it: Ms. Pac-Man is a stock Pac-Man PCB with a daughterboard carrying three extra ROMs (u5/u6/u7) and an address decoder. Video, audio, input and PROM decode are bit-identical and those files are copies; everything Ms. Pac-Man-specific is confined to mspacman_assets.cpp (the address/data-line bitswap decode and the 40 eight-byte patches) and mspacman_ports.cpp (the two ROM banks and the eight address ranges whose mere access flips between them). Every hardware fact was verified against MAME's own pacman driver source -- init_mspacman(), mspacman_install_patches(), mspacman_map(), ROM_START(mspacman) -- see each .cpp file's header comment for citations. Pair with any ArcadeBoard_* library that implements ArcadeHAL to build a flashable sketch.
category=Other
