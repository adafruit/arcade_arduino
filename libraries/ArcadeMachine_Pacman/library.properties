name=ArcadeMachine_Pacman
version=0.1.0
author=arcade_arduino project
maintainer=arcade_arduino project
sentence=Pac-Man "machine": Z80 memory/IO map, tile+sprite VRAM renderer, Namco WSG sound, ROM/PROM asset manifest -- board-agnostic.
paragraph=Built from scratch against the real arcade ROM/PROM dump (not ported from any existing emulator -- picopacman-main was investigated and found to contain no CPU/hardware emulation at all). Every hardware fact (memory map, I/O map, interrupt scheme, tile/sprite decode, palette decode, WSG registers) was verified against MAME's own pacman driver source -- see each .cpp file's header comment for citations. Pair with any ArcadeBoard_* library that implements ArcadeHAL to build a flashable sketch.
